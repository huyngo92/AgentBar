[package]
name = "tauri-app"
version = "0.1.0"
description = "AgentBar — Native macOS menu bar app to switch Claude Code gateways & Gemini Antigravity accounts with live quotas & token analytics"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
httparse = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
security-framework = "3.7.0"
base64 = "0.23.1"

[profile.dev]
debug = 0
split-debuginfo = "off"
incremental = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
